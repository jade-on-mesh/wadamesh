<!-- MediaMesh Flasher for WordPress
     Paste this whole block into a "Custom HTML" block (needs an administrator account).
     It shows the live flasher from GitHub Pages and grows to fit, so you never need to re-paste it.
     Visitors flash from Chrome or Edge on a computer.
     THEME: "light", "dark", or "auto" (follows the visitor's system setting).
     Open a tab directly by adding #cascade, #spectra, #tdeck, #m9, #pager or #p4 to this page's URL. -->
<iframe id="mediamesh-flasher" title="MediaMesh Flasher" allow="serial" style="display:block;width:100%;height:2400px;border:0;background:transparent"></iframe>
<script>
(function () {
  var THEME = "light";
  var SITE = "https://jade-on-mesh.github.io";
  var frame = document.getElementById("mediamesh-flasher");
  frame.src = SITE + "/wadamesh-tak/" + (THEME === "auto" ? "" : "?theme=" + THEME) + location.hash;
  window.addEventListener("message", function (e) {
    if (e.origin === SITE && e.data && e.data.mediamesh === "height") frame.style.height = e.data.h + "px";
  });
})();
</script>
