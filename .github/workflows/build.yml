# Compile check for work branches: host tests plus a T-Deck firmware build.
# Releases still come from release.yml (beta_* tags).
name: build

on:
  push:
    branches-ignore: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VOX photo wire format
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_vox_wire test/test_vox_wire.cpp
          /tmp/test_vox_wire
      - name: VOX photo fetch client (simulated mesh and Open TAK sender)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I src \
              -o /tmp/test_vox_fetch test/test_vox_fetch.cpp src/ui-touch/VoxFetch.cpp
          /tmp/test_vox_fetch
      - name: VOX voice decoder (Codec2, sample-exact against the app's build)
        run: test/build_vox_voice_test.sh /tmp/vox_voice
      - name: VOX photo decoder (bit-exact against libaom, sanitizers on)
        run: test/build_vox_av1_test.sh /tmp/vox_av1

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [LilyGo_TDeck_companion_radio_touch, ThinkNode_M9_companion_radio_touch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        run: |
          unset WIFI_SSID WIFI_PWD
          pio run -e ${{ matrix.env }}
      - name: Firmware size
        run: |
          ls -la .pio/build/${{ matrix.env }}/firmware.bin
          echo "### ${{ matrix.env }}" >> "$GITHUB_STEP_SUMMARY"
          echo "firmware.bin: $(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin) bytes" >> "$GITHUB_STEP_SUMMARY"
          ~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-size \
            .pio/build/${{ matrix.env }}/firmware.elf >> "$GITHUB_STEP_SUMMARY" || true
          ~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-size -t \
            .pio/build/${{ matrix.env }}/lib*/libdav1d.a 2>/dev/null | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          # Also as an annotation, so the numbers are readable from the checks API.
          BIN=$(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin)
          DAV=$(~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-nm -S --size-sort \
                .pio/build/${{ matrix.env }}/firmware.elf | grep -ciE ' dav1d_' || true)
          echo "::notice title=${{ matrix.env }} size::firmware.bin ${BIN} bytes; dav1d symbols linked: ${DAV}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware*.bin
          if-no-files-found: warn
